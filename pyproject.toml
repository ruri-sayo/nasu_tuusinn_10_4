[project]
name = "nasura-comm"
version = "0.1.0"
description = "NASURA communication PoC: signaling hub, control plane and safety core"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "aiortc>=1.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasura_comm"]

[tool.pytest.ini_options]
markers = [
  "verifies(id, spec=None): specification-derived test",
  "impl_aware(id=None): implementation-aware test",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
# D: docstring presence/format (SAAL rule 11.4)
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
