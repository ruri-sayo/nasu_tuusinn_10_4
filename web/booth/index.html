<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NASURA booth</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  video { width: 100%; background: #000; border-radius: 8px; }
  #estop { width: 100%; height: 140px; font-size: 40px; font-weight: 700; color: #fff; background: #d00;
           border: 4px solid #600; border-radius: 16px; cursor: pointer; margin-top: 12px; }
  #estop:active { background: #900; }
  #release { width: 100%; margin-top: 8px; padding: 12px; font-size: 18px; background: #333; color: #eee;
             border: 1px solid #666; border-radius: 10px; cursor: pointer; }
  #release.armed { background: #a60; }
  #releaseHint { color: #aaa; font-size: 13px; min-height: 1.4em; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 4px 8px; border-bottom: 1px solid #333; text-align: left; font-variant-numeric: tabular-nums; }
  th { color: #999; font-weight: 500; width: 38%; }
  h2 { font-size: 16px; color: #9cf; margin: 16px 0 4px; }
  .bad { color: #f44; font-weight: 700; }
  .ok { color: #3c3; }
  .warn { color: #fc3; }
  #carState { font-size: 32px; font-weight: 700; }
  #ws { font-size: 13px; }
  #error { color: #f44; }
</style>
</head>
<body>
<main>
  <section>
    <video id="preview" autoplay playsinline muted></video>
    <div id="ws">WS: -</div>
    <div id="error"></div>
    <button id="estop">E-STOP</button>
    <button id="release">E-STOP 解除（2秒以内に2回）</button>
    <div id="releaseHint"></div>
  </section>
  <section>
    <div>車載状態: <span id="carState">-</span> <span id="latched"></span></div>
    <h2>接続</h2>
    <table id="conn"></table>
    <h2>制御リンク（S3）</h2>
    <table id="ctrl"></table>
    <h2>映像</h2>
    <table id="media"></table>
    <h2>テレメトリ</h2>
    <table id="tlm"></table>
    <h2>破棄件数</h2>
    <table id="dropped"></table>
  </section>
</main>
<script type="module" src="booth.js"></script>
</body>
</html>
