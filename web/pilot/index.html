<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NASURA pilot</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
  .box { background: rgba(0, 0, 0, .6); border-radius: 8px; padding: 6px 10px; }
  #estop { pointer-events: auto; margin-left: auto; padding: 14px 28px; font-size: 24px; font-weight: 700; color: #fff; background: #d00; border: 0; border-radius: 12px; }
  #estop.flash, #estop:active { background: #900; }
  #help { position: fixed; left: 8px; bottom: 8px; font-size: 13px; }
  #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 20px 36px; font-size: 24px; border: 0; border-radius: 16px; background: #27c; color: #fff; }
  #focus { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); background: #a60; color: #fff; padding: 6px 14px; border-radius: 8px; }
  .bad { color: #f66; } .ok { color: #3c3; }
  video, audio { display: none; }
  #hud, #help, #focus, #start { z-index: 2; }
  body.flat #view { display: none; }
  body.flat #video { display: block; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="box">WS: <span id="ws">-</span> ／ S1: <span id="s1">-</span> ／ 車載: <span id="car">-</span> ／ コントローラー: <span id="pad">-</span> ／ カメラ: <span id="camera">-</span>
    <div class="bad" id="error"></div></div>
  <button id="estop">E-STOP</button>
</div>
<div id="help" class="box">左スティック＝走行 ／ A・B＝ステージ横 ／ 右スティック上下＝ステージ前後 ／ 右スティック左右＝視点 ／ 十字上下＝視点上下 ／ View(Back)＝視点リセット ／ L3＋R3・Esc・Space＝E-STOP<br>
マウス：ドラッグ＝視点、ホイール＝ズーム、ダブルクリック・R＝リセット、F＝全画面 ／ E-STOP 解除は booth ページで行う</div>
<div id="focus" hidden>このウィンドウを選択してください（選択していないとコントローラーが効かない場合があります）</div>
<button id="start">クリックして開始（音声を有効にする）</button>
<video id="video" autoplay playsinline muted></video>
<audio id="audio" autoplay></audio>
<script type="module" src="pilot.js"></script>
</body>
</html>
