<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NASURA quest</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #eee; font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  #enter { width: 100%; padding: 24px; font-size: 28px; border-radius: 16px; border: 0; background: #27c; color: #fff; }
  #enter:disabled { background: #444; color: #999; }
  video { width: 100%; background: #000; border-radius: 8px; margin-top: 12px; }
  #xrCanvas { display: none; }
  .row { margin: 8px 0; }
  .bad { color: #f44; } .ok { color: #3c3; }
</style>
</head>
<body>
<main>
  <h1>NASURA 操縦席</h1>
  <button id="enter" disabled>映像の到着を待っています</button>
  <div class="row" id="hint"></div>
  <div class="row">WS: <span id="ws">-</span> ／ S1: <span id="s1">-</span> ／ 車載: <span id="car">-</span></div>
  <div class="row bad" id="error"></div>
  <div class="row">操作：左スティック＝走行、A/B＝ステージ横、右スティック上下＝ステージ前後、左 Y＝今向いている方向を正面にする、両スティック押し込み＝E-STOP</div>
  <video id="video" autoplay playsinline muted></video>
  <audio id="audio" autoplay></audio>
  <canvas id="xrCanvas"></canvas>
</main>
<script type="module" src="quest.js"></script>
</body>
</html>
